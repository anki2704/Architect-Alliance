name: Architect Alliance CI

on:
  push:
    branches:
      - main
      - ankita
      - nischal

  pull_request:
    branches:
      - main
      - ankita
      - nischal
      
jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build